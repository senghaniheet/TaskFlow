name: Deploy TaskFlow

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Helm
        uses: azure/setup-helm@29960d0f5f19214b88e1d9ba750a9914ab0f1a2f # v4.0.0

      - name: Setup Kubectl
        uses: azure/setup-kubectl@3e0aec4d80787158d308d7b364cb1b702e7feb7f # v4.0.0

      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build API Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/taskflow-api:${{ github.sha }} \
            ./server

      - name: Build Web Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/taskflow-web:${{ github.sha }} \
            ./client

      - name: Push API Image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/taskflow-api:${{ github.sha }}

      - name: Push Web Image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/taskflow-web:${{ github.sha }}

      - name: Setup Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      - name: Helm Upgrade Deploy
        run: |
          helm upgrade --install taskflow ./helm/taskflow \
            --namespace taskflow \
            --create-namespace \
            --set api.image.repository=ghcr.io/${{ github.repository_owner }}/taskflow-api \
            --set api.image.tag=${{ github.sha }} \
            --set web.image.repository=ghcr.io/${{ github.repository_owner }}/taskflow-web \
            --set web.image.tag=${{ github.sha }} \
            --set api.env.jwtSecret=${{ secrets.JWT_SECRET }} \
            --description "Deploy commit ${{ github.sha }}"