# Default values for taskflow.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

namespace: taskflow

mongo:
  image:
    repository: mongo
    tag: "7"
    pullPolicy: IfNotPresent
  storageSize: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

api:
  replicaCount: 3
  image:
    repository: ghcr.io/senghaniheet/taskflow-api
    tag: latest
    pullPolicy: Always
  env:
    nodeEnv: production
    port: "5000"
    mongoUri: "mongodb://mongo:27017/taskflow"
    jwtExpiresIn: "1d"
    allowedOrigins: "http://localhost:8080,http://taskflow.local"
    jwtSecret: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

web:
  replicaCount: 3
  image:
    repository: ghcr.io/senghaniheet/taskflow-web
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

ingress:
  enabled: true
  ingressClassName: nginx
  host: taskflow.local
