# 01-pod.yaml — Raw Kubernetes YAML
# See README.md in this folder for full explanation.


apiVersion: v1
kind: Pod
metadata:
  name: taskflow-api-pod        # Unique name within the namespace
  namespace: taskflow
  labels:
    app: api                    # Used by Services to find this Pod via selector
spec:
  containers:
    - name: api                 # Container name (visible in logs, describe)
      image: ghcr.io/senghaniheet/taskflow-api:latest
      imagePullPolicy: Never    # Use local Minikube image (skip registry pull)

      ports:
        - containerPort: 5000   # Just documentation — doesn't actually open the port

      # Environment variables injected into the container process
      env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "5000"
        - name: MONGO_URI
          value: "mongodb://mongo:27017/taskflow"
        - name: JWT_SECRET
          value: "my-super-secret-key"   # ← NEVER hardcode secrets like this!

      # Resource Requests: minimum guaranteed resources
      # Resource Limits: hard ceiling — container is killed if exceeded (OOMKilled)
      resources:
        requests:
          cpu: 200m              # 200 millicores = 0.2 CPU cores
          memory: 128Mi
        limits:
          cpu: 1000m             # 1 full CPU core max
          memory: 512Mi

      # Readiness Probe: Is the container ready to receive traffic?
      # K8s won't route requests to this Pod until this passes.
      readinessProbe:
        httpGet:
          path: /api/health
          port: 5000
        initialDelaySeconds: 5   # Wait 5s before first check
        periodSeconds: 10        # Check every 10s

      # Liveness Probe: Is the container still alive?
      # If this fails repeatedly, K8s restarts the container.
      livenessProbe:
        httpGet:
          path: /api/health
          port: 5000
        initialDelaySeconds: 15
        periodSeconds: 15
        failureThreshold: 5      # Restart after 5 consecutive failures
