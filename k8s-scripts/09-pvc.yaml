# 09-pvc.yaml — Raw Kubernetes YAML
# See README.md in this folder for full explanation.


apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: taskflow-mongo-pvc    # StatefulSet references this by name
  namespace: taskflow
spec:
  accessModes:
    - ReadWriteOnce            # Only one node can mount for read/write at a time

  resources:
    requests:
      storage: 5Gi             # Request 5 gigabytes of storage

  # storageClassName omitted → uses the cluster's default StorageClass
  # In Minikube, this is "standard" which creates a hostPath volume.
  # In production (GKE, EKS), this would be "ssd", "gp2", etc.
  # Explicitly set it with:
  # storageClassName: standard
