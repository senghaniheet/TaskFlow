# 05-service-nodeport.yaml — Raw Kubernetes YAML
# See README.md in this folder for full explanation.


apiVersion: v1
kind: Service
metadata:
  name: api-nodeport          # Separate name to not conflict with ClusterIP service
  namespace: taskflow
  labels:
    app: api
spec:
  type: NodePort
  ports:
    - port: 5000              # Internal cluster port
      targetPort: 5000        # Pod port
      nodePort: 30500         # External port on the node (30000-32767 range)
                              # If omitted, K8s assigns a random port in this range
  selector:
    app.kubernetes.io/name: taskflow
    app: api                  # Same selector — routes to the same API pods
