# 08-secret.yaml — Raw Kubernetes YAML
# See README.md in this folder for full explanation.


apiVersion: v1
kind: Secret
metadata:
  name: taskflow-api-secret   # Referenced by Deployment's envFrom → secretRef
  namespace: taskflow
  labels:
    app: api

# "Opaque" is the generic type — just arbitrary key-value pairs.
# Other types: kubernetes.io/tls, kubernetes.io/dockerconfigjson
type: Opaque

# stringData: write plaintext, K8s encodes it.
# When you kubectl get secret, the values appear base64-encoded.
stringData:
  JWT_SECRET: "REPLACE_WITH_CRYPTOGRAPHICALLY_SECURE_RANDOM_STRING"
  MONGO_URI: "mongodb://mongo:27017/taskflow"

# Alternative using pre-encoded data:
# data:
#   JWT_SECRET: UkVQTEFDRV9XSVRIX0NSWVBUT0dSQVBISUNBTExZX1NFQ1VSRV9SQU5ET01fU1RSSU5H
#   MONGO_URI: bW9uZ29kYjovL21vbmdvOjI3MDE3L3Rhc2tmbG93
